<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 220" role="img" aria-label="AI速報まとめ" fill="none">
  <!-- signal / broadcast motif（速報＝電波が届く） -->
  <g stroke="#5FB5AD" stroke-width="8" stroke-linecap="round">
    <path d="M87.2 85.4 A30 30 0 0 1 87.2 134.6" opacity="0.9"/>
    <path d="M99.8 67.4 A52 52 0 0 1 99.8 152.6" opacity="0.6"/>
    <path d="M112.4 49.4 A74 74 0 0 1 112.4 170.6" opacity="0.35"/>
  </g>
  <circle cx="66" cy="110" r="7" fill="#5FB5AD"/>
  <!-- wordmark -->
  <text x="196" y="104" dominant-baseline="central" font-size="82" font-weight="700"
    font-family="system-ui, -apple-system, 'Hiragino Kaku Gothic ProN', 'Noto Sans JP', 'Yu Gothic', Meiryo, sans-serif">
    <tspan fill="#5FB5AD">AI</tspan><tspan fill="#ECE7E1">速報まとめ</tspan>
  </text>
  <!-- pulse line（ニュースティッカーの鼓動） -->
  <polyline points="196,170 470,170 500,148 520,192 548,170 848,170"
    stroke="#5FB5AD" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" opacity="0.5"/>
</svg>
